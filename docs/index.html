<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>14 февраля · красочный день</title>
  <style>
    /* сброс и базовые шрифты */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #ffdde1 0%, #f9c9e7 40%, #ffe4b5 100%);
      font-family: 'Segoe UI', 'Quicksand', system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* плавающие сердечки (фон) */
    .floating-hearts {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 0;
    }

    .heart-float {
      position: absolute;
      color: rgba(255, 90, 140, 0.3);
      font-size: clamp(1.2rem, 6vw, 4rem);
      user-select: none;
      animation: floatUp 12s infinite ease-in-out;
      bottom: -10%;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.5; }
      50% { opacity: 0.9; transform: translateY(-40vh) rotate(15deg); }
      100% { transform: translateY(-100vh) rotate(25deg); opacity: 0; }
    }

    /* основные карточки */
    .valentine-wrapper {
      max-width: 1100px;
      width: 100%;
      background: rgba(255, 250, 240, 0.6);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 60px 60px 40px 40px;
      box-shadow: 0 30px 50px rgba(220, 70, 120, 0.25),
                  0 0 0 4px rgba(255, 215, 235, 0.6),
                  inset 0 0 20px #ffbfd7;
      padding: 40px 30px;
      position: relative;
      z-index: 10;
      border: 2px solid #fff9;
      transition: all 0.3s;
    }

    /* заголовок с конфетти-эффектом */
    .title-section {
      text-align: center;
      margin-bottom: 40px;
      position: relative;
    }

    .title-section h1 {
      font-size: clamp(2.8rem, 12vw, 5.2rem);
      font-weight: 800;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #d4145a, #fbb03b, #ff6f91, #c44569);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 5px 5px 20px rgba(255, 80, 150, 0.4), 2px 2px 0 #ffeef7;
      transform: rotate(-1deg);
      margin-bottom: 15px;
      line-height: 1.1;
      animation: glitchPop 2s infinite alternate;
    }

    @keyframes glitchPop {
      0% { transform: scale(1) rotate(-1deg); text-shadow: 5px 5px 0 #f09, -3px -3px 0 #6cf; }
      50% { transform: scale(1.02) rotate(0.5deg); text-shadow: -7px 3px 0 #fc6, 5px -5px 0 #f4f; }
      100% { transform: scale(0.98) rotate(-1.2deg); text-shadow: 6px -4px 0 #f4c, -5px 7px 0 #af6; }
    }

    .subhead {
      font-size: 1.8rem;
      font-weight: 600;
      background: rgba(255, 235, 245, 0.8);
      display: inline-block;
      padding: 12px 35px;
      border-radius: 100px;
      color: #b13e6d;
      box-shadow: 0 8px 0 #ffacc7, 0 10px 20px #ffb6c190;
      backdrop-filter: blur(4px);
      border: 3px dotted white;
      margin-top: 10px;
    }

    /* сетка открыток (основной контент) */
    .card-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
      margin: 40px 0 20px;
    }

    .greeting-card {
      flex: 1 1 280px;
      max-width: 330px;
      background: radial-gradient(circle at 10% 20%, #fff5fb, #ffe2f0);
      border-radius: 50px 50px 40px 40px;
      padding: 28px 18px 30px;
      text-align: center;
      box-shadow: 0 15px 0 #f07faa, 0 25px 30px #ffa5c3, 0 0 0 6px white;
      transition: transform 0.2s ease, box-shadow 0.3s;
      border: 4px solid #ffffffdd;
      position: relative;
    }

    .greeting-card:hover {
      transform: translateY(-12px) rotate(1deg);
      box-shadow: 0 20px 0 #e06b98, 0 35px 40px #ff98ba, 0 0 0 8px #fff9;
    }

    /* разноцветные акценты для карточек */
    .card-1 { background: radial-gradient(circle at 30% 20%, #fff0db, #fed9e8); }
    .card-2 { background: radial-gradient(circle at 70% 10%, #f5e0ff, #d7f0ff); }
    .card-3 { background: radial-gradient(circle at 20% 80%, #fcf5d8, #ffd9f0); }

    .card-icon {
      font-size: 4.5rem;
      line-height: 1;
      margin-bottom: 10px;
      filter: drop-shadow(2px 8px 8px #f97fb3);
    }

    .greeting-card h2 {
      font-size: 2.2rem;
      margin: 15px 0 10px;
      color: #b72e62;
      background: linear-gradient(145deg, #c93f73, #ff8ab5);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .greeting-card p {
      font-size: 1.3rem;
      font-weight: 600;
      color: #ac4f76;
      background: rgba(255,255,240,0.5);
      padding: 12px 5px;
      border-radius: 60px;
      margin: 10px 0;
      border: 2px solid white;
    }

    .greeting-card button {
      background: #ff4d7a;
      border: none;
      color: white;
      font-size: 1.3rem;
      font-weight: bold;
      padding: 12px 22px;
      border-radius: 50px;
      box-shadow: 0 7px 0 #a13353, 0 5px 20px #ffa5b9;
      cursor: pointer;
      transition: 0.08s linear;
      margin-top: 15px;
      border: 2px solid #ffffe0;
      width: 100%;
      text-transform: uppercase;
    }

    .greeting-card button:active {
      transform: translateY(7px);
      box-shadow: 0 2px 0 #a13353, 0 5px 12px #f47898;
    }

    /* сладости и интерактив */
    .candy-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      font-size: 2rem;
      margin: 15px 0 5px;
      filter: drop-shadow(0 4px 6px hotpink);
    }

    /* нижняя часть с сюрпризом */
    .footer-message {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 30px;
      background: rgba(255, 215, 235, 0.7);
      backdrop-filter: blur(5px);
      border-radius: 60px 60px 30px 30px;
      padding: 25px 20px;
      margin-top: 35px;
      border: 5px dashed #ff85a8;
    }

    .love-counter {
      font-size: 2rem;
      font-weight: 700;
      background: #ffb0c3;
      padding: 15px 30px;
      border-radius: 50px;
      color: #2d0f1b;
      box-shadow: inset -2px -2px 0 #feb0d0, inset 2px 2px 0 white, 0 10px 0 #a04a64;
    }

    .love-counter span {
      background: white;
      padding: 0 10px;
      border-radius: 30px;
      font-size: 2.8rem;
      margin-left: 15px;
      border: 3px solid #f84e7a;
      display: inline-block;
      line-height: 1.3;
      min-width: 90px;
      text-align: center;
    }

    .surprise-btn {
      background: linear-gradient(45deg, #fdc830, #f37335);
      border: none;
      font-size: 2rem;
      padding: 20px 45px;
      border-radius: 80px;
      font-weight: 800;
      color: white;
      text-shadow: 2px 2px 0 #b64516;
      box-shadow: 0 12px 0 #aa3f1c, 0 10px 30px #ff9f4b;
      cursor: pointer;
      transition: all 0.1s;
      border: 3px solid #fff2b5;
      letter-spacing: 2px;
    }

    .surprise-btn:active {
      transform: translateY(12px);
      box-shadow: 0 3px 0 #aa3f1c, 0 8px 20px #fc9f4b;
    }

    #surpriseOutput {
      font-size: 2.2rem;
      background: #ffffd0;
      padding: 20px 25px;
      border-radius: 70px;
      color: #d43f75;
      font-weight: 700;
      border: 5px double #ff9eb5;
      box-shadow: 0 0 0 6px #fee1aa;
      min-width: 240px;
      text-align: center;
    }

    /* крошечные блестяшки */
    .sparkle {
      position: absolute;
      background: white;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      box-shadow: 0 0 15px 5px #ffec9f;
      pointer-events: none;
    }

    /* адаптив */
    @media (max-width: 650px) {
      .valentine-wrapper { padding: 25px 15px; }
      .footer-message { flex-direction: column; }
      .subhead { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <!-- плавающие сердечки (фон) -->
  <div class="floating-hearts">
    <div class="heart-float" style="left: 5%; animation-duration: 10s; animation-delay: 0s;">❤️</div>
    <div class="heart-float" style="left: 15%; animation-duration: 14s; animation-delay: 3s;">🧡</div>
    <div class="heart-float" style="left: 25%; animation-duration: 11s; animation-delay: 1s;">💛</div>
    <div class="heart-float" style="left: 35%; animation-duration: 16s; animation-delay: 5s;">💚</div>
    <div class="heart-float" style="left: 45%; animation-duration: 13s; animation-delay: 2s;">💙</div>
    <div class="heart-float" style="left: 55%; animation-duration: 12s; animation-delay: 4s;">💜</div>
    <div class="heart-float" style="left: 65%; animation-duration: 15s; animation-delay: 1.5s;">🩷</div>
    <div class="heart-float" style="left: 75%; animation-duration: 18s; animation-delay: 6s;">🤍</div>
    <div class="heart-float" style="left: 85%; animation-duration: 11s; animation-delay: 2.5s;">🖤</div>
    <div class="heart-float" style="left: 95%; animation-duration: 17s; animation-delay: 3.2s;">❤️‍🔥</div>
  </div>

  <!-- главный красочный блок -->
  <div class="valentine-wrapper">
    <div class="title-section">
      <h1>💖 14 ФЕВРАЛЯ 💖</h1>
      <div class="subhead">♥ день всех влюблённых ♥</div>
    </div>

    <!-- разноцветные карточки с пожеланиями -->
    <div class="card-grid">
      <!-- карточка 1 -->
      <div class="greeting-card card-1">
        <div class="card-icon">🍬🍫</div>
        <h2>Сладости</h2>
        <p>конфетное настроение</p>
        <div class="candy-row">🍭 🍡 🍬 🍫 🍩</div>
        <button class="sweet-treat" data-message="🍬 целую конфетно! 🍬">хочу конфету</button>
      </div>
      <!-- карточка 2 -->
      <div class="greeting-card card-2">
        <div class="card-icon">💌🌸</div>
        <h2>Признания</h2>
        <p>валентинки-картинки</p>
        <div class="candy-row">💞 💓 💗 💖 💘</div>
        <button class="sweet-treat" data-message="💕 ты мне очень нравишься! 💕">скажи нежность</button>
      </div>
      <!-- карточка 3 -->
      <div class="greeting-card card-3">
        <div class="card-icon">🎈🧸</div>
        <h2>Подарки</h2>
        <p>сюрпризы и цветы</p>
        <div class="candy-row">🧁 🍰 🎁 🧸 💐</div>
        <button class="sweet-treat" data-message="🎁 вот тебе подарочек! обнимаю 🎁">хочу сюрприз</button>
      </div>
    </div>

    <!-- нижний блок с интерактивным счётчиком любви и большим сюрпризом -->
    <div class="footer-message">
      <div class="love-counter">
        ❤️ счётчик лайков <span id="likeCounter">0</span>
      </div>
      <button class="surprise-btn" id="bigSurprise">💥 БАХ 💥</button>
      <div id="surpriseOutput">✨🌈🦄✨</div>
    </div>

    <!-- мелкая магия: скрытое подтверждение 14 февраля -->
    <div style="text-align: center; margin-top: 15px; opacity: 0.8; font-size: 1.3rem; color: #b1476a;">
      ⚡ с днём святого валентина! ⚡
    </div>
  </div>

  <script>
    (function() {
      // динамическое изменение счётчика и сюрпризы
      let likeCount = 0;
      const likeSpan = document.getElementById('likeCounter');
      const surpriseOutput = document.getElementById('surpriseOutput');
      const bigBtn = document.getElementById('bigSurprise');
      
      // коллекция ярких фраз для большого сюрприза
      const surpriseMessages = [
        '💖 МИЛЛИОН АЛЫХ РОЗ 💖',
        '🍬 LOVE STORM 🍬',
        '🌈 ЦВЕТНОЕ НАСТРОЕНИЕ 🌈',
        '💘 ВЛЮБЛЯЙСЯ БЕЗУМНО! 💘',
        '🎉 14 ФЕВРАЛЯ УРА! 🎉',
        '🦄 СЧАСТЬЕ В КАЖДЫЙ ДОМ 🦄',
        '✨ ИСКРЫ И КОНФЕТТИ ✨',
        '🧨 ФЕЙЕРВЕРК ЧУВСТВ 🧨',
        '🍫 ШОКОЛАДНОЕ БЕЗУМИЕ 🍫',
        '🌺 БУКЕТ ИЗ СЕРДЕЦ 🌺'
      ];

      // функция рандомного яркого цвета (для настроения)
      function randomPastel() {
        const hue = Math.floor(Math.random() * 360);
        return `hsl(${hue}, 80%, 75%)`;
      }

      // обработка кнопок внутри карточек (сладкие сообщения)
      const sweetButtons = document.querySelectorAll('.sweet-treat');
      sweetButtons.forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          // увеличиваем счётчик лайков
          likeCount++;
          likeSpan.textContent = likeCount;

          const message = this.getAttribute('data-message') || '💝 с 14 февраля! 💝';
          // показываем сообщение в нижнем поле сюрприза (кратковременно)
          surpriseOutput.textContent = message;
          surpriseOutput.style.background = randomPastel();
          // дополнительная анимация
          surpriseOutput.style.transform = 'scale(1.1)';
          setTimeout(() => { surpriseOutput.style.transform = 'scale(1)'; }, 150);

          // маленькая конфетти-вспышка (имитация)
          createMiniConfetti();
        });
      });

      // ОГРОМНАЯ КНОПКА БАХ
      bigBtn.addEventListener('click', function() {
        likeCount += 5;  // сразу +5 лайков
        likeSpan.textContent = likeCount;

        // случайное сообщение из списка
        const randomIndex = Math.floor(Math.random() * surpriseMessages.length);
        surpriseOutput.textContent = surpriseMessages[randomIndex];
        surpriseOutput.style.background = randomPastel();
        surpriseOutput.style.transform = 'scale(1.2)';
        setTimeout(() => { surpriseOutput.style.transform = 'scale(1)'; }, 200);

        // запускаем настоящий конфетти-дождь (много сердечек)
        for (let i = 0; i < 18; i++) {
          setTimeout(() => createFloatingHeart(), i * 40);
        }
        // дополнительно меняем фончик на пару секунд
        document.body.style.transition = 'background 0.5s';
        document.body.style.background = 'linear-gradient(145deg, #fff0d4, #ffcbdb, #ffe7b0)';
        setTimeout(() => {
          document.body.style.background = 'linear-gradient(145deg, #ffdde1 0%, #f9c9e7 40%, #ffe4b5 100%)';
        }, 500);
      });

      // Функция создания маленьких падающих сердечек (конфетти)
      function createFloatingHeart() {
        const heart = document.createElement('div');
        heart.innerHTML = ['❤️','🧡','💛','💚','💙','💜','🩷','🩵'][Math.floor(Math.random() * 8)];
        heart.style.position = 'fixed';
        heart.style.left = Math.random() * 100 + '%';
        heart.style.top = '-10%';
        heart.style.fontSize = (Math.random() * 30 + 20) + 'px';
        heart.style.zIndex = 9999;
        heart.style.pointerEvents = 'none';
        heart.style.opacity = '0.9';
        heart.style.filter = 'drop-shadow(0 0 5px hotpink)';
        heart.style.transition = 'transform 2s ease-out, opacity 1.5s';
        document.body.appendChild(heart);

        let animationFrame;
        let startTime = null;
        const duration = 2000; // 2 секунды

        function fall(currentTime) {
          if (!startTime) startTime = currentTime;
          const elapsed = currentTime - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const yPos = progress * 110; // от верха до низа экрана +10
          const rotate = progress * 360;
          heart.style.transform = `translateY(${yPos}vh) rotate(${rotate}deg)`;
          heart.style.opacity = 1 - progress * 0.7;

          if (progress < 1) {
            animationFrame = requestAnimationFrame(fall);
          } else {
            heart.remove();
          }
        }
        animationFrame = requestAnimationFrame(fall);
      }

      // функция для маленькой конфетти (легкая имитация)
      function createMiniConfetti() {
        for (let i = 0; i < 6; i++) {
          const conf = document.createElement('div');
          conf.style.position = 'fixed';
          conf.style.left = 40 + Math.random() * 30 + '%';
          conf.style.top = '60%';
          conf.style.fontSize = (Math.random() * 25 + 15) + 'px';
          conf.style.pointerEvents = 'none';
          conf.style.zIndex = 9998;
          conf.style.opacity = '1';
          conf.innerHTML = ['✨','💖','🌸','🎊','💫','🪅'][Math.floor(Math.random() * 6)];
          conf.style.transition = 'all 1.2s cubic-bezier(0.2,0.8,0.4,1)';
          document.body.appendChild(conf);

          setTimeout(() => {
            conf.style.transform = `translate(${Math.random() * 200 - 100}px, -${Math.random() * 200 + 150}px) rotate(${Math.random() * 360}deg)`;
            conf.style.opacity = '0';
          }, 10);
          setTimeout(() => conf.remove(), 1300);
        }
      }

      // добавим счётчику возможность клика (+1 по клику на сам счётчик)
      likeSpan.addEventListener('click', function() {
        likeCount++;
        likeSpan.textContent = likeCount;
        surpriseOutput.textContent = '💞 +1 чувство 💞';
        surpriseOutput.style.background = randomPastel();
        setTimeout(() => {
          surpriseOutput.textContent = '✨🌈🦄✨';
        }, 700);
        createMiniConfetti();
      });

      // Поздравительное начальное сообщение (радужное)
      setTimeout(() => {
        surpriseOutput.style.background = '#fee1aa';
      }, 100);
    })();
  </script>
</body>
</html>
